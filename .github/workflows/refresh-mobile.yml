name: Refresh mobile trading snapshot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Refresh mode
        required: true
        default: auto
        type: choice
        options:
          - auto
          - hourly
          - midday
          - close
  schedule:
    - cron: "35 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "35 3 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "10 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: mobile-snapshot-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DATA_DIR: ${{ github.workspace }}/cloud/data
      TDX_BRIDGE_DIR: ${{ github.workspace }}/cloud/data/tdx_seed
      ENABLE_THS: "0"
      ENABLE_EASTMONEY: "1"
      ENABLE_TENCENT: "1"
      DATA_SOURCE_LABEL: "云端批量报价 + 通达信日K基线"
      QUOTE_CACHE_TTL_SECONDS: "1800"
      MIN_EXTERNAL_INTERVAL_SECONDS: "12"
      PROVIDER_COOLDOWN_SECONDS: "5"
      PROVIDER_REQUEST_RETRIES: "1"
      PROVIDER_RETRY_DELAY_SECONDS: "8"
      ASHARE_MOBILE_PASSPHRASE: ${{ secrets.ASHARE_MOBILE_PASSPHRASE }}
      ASHARE_WATCHLIST_JSON: ${{ secrets.ASHARE_WATCHLIST_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Select refresh mode
        id: mode
        shell: bash
        run: |
          requested="${{ github.event.inputs.mode || 'auto' }}"
          if [[ "$requested" != "auto" ]]; then
            mode="$requested"
          elif [[ "${{ github.event.schedule }}" == "35 3 * * 1-5" ]]; then
            mode="midday"
          elif [[ "${{ github.event.schedule }}" == "10 7 * * 1-5" ]]; then
            mode="close"
          else
            mode="hourly"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Restore private watchlist
        shell: bash
        run: |
          if [[ -z "$ASHARE_WATCHLIST_JSON" ]]; then
            echo "ASHARE_WATCHLIST_JSON is not configured" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(os.environ["ASHARE_WATCHLIST_JSON"])
          items = payload.get("items") or []
          if not items:
              raise SystemExit("watchlist secret contains no items")
          target = Path(os.environ["APP_DATA_DIR"]) / "watchlist.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(f"Loaded {len(items)} watchlist items")
          PY

      - name: Recalculate prices, levels and advice
        run: |
          python cloud/scripts/scheduled_mobile_refresh.py \
            --mode "${{ steps.mode.outputs.mode }}" \
            --force \
            --minimum-evaluation-ratio 0.85

      - name: Encrypt snapshot
        run: |
          if [[ ${#ASHARE_MOBILE_PASSPHRASE} -lt 12 ]]; then
            echo "ASHARE_MOBILE_PASSPHRASE is not configured" >&2
            exit 1
          fi
          node cloud/scripts/encrypt_mobile_snapshot.mjs \
            cloud/data/mobile_snapshot.json \
            data/mobile_snapshot.enc.json

      - name: Advance daily-K seed after close
        if: steps.mode.outputs.mode == 'close'
        run: python cloud/scripts/update_cloud_kline_seed.py

      - name: Publish encrypted snapshot
        shell: bash
        run: |
          git config user.name "A-share snapshot automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/mobile_snapshot.enc.json cloud/data/tdx_seed/klines
          if git diff --cached --quiet; then
            echo "Encrypted snapshot unchanged"
            exit 0
          fi
          git commit -m "Update encrypted mobile snapshot: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase origin main
          git push origin HEAD:main
